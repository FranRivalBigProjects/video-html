<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <meta name="google-site-verification" content="PkLa_ViOo6FAHpvh8SacceMb95o9tePRdrqLNBz9X1M" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extractor de Frames</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0d0f0e;
    --panel: #15181a;
    --line: #2a2f2c;
    --text: #e8ebe6;
    --muted: #8b938c;
    --accent: #c9ff3f;
    --accent-dim: #7a9b26;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:840px;margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-size:28px;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  p.sub{color:var(--muted);margin:0;font-size:14px;}

  .drop{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:40px 20px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    background:var(--panel);
  }
  .drop:hover, .drop.drag{
    border-color:var(--accent);
    background:#181c19;
  }
  .drop .icon{font-size:28px;margin-bottom:10px;opacity:.8;}
  .drop .main-txt{font-size:15px;font-weight:500;}
  .drop .sub-txt{font-size:12px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;}
  input[type=file]{display:none;}

  video{display:none;}
  canvas{display:none;}

  .status{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:14px;
    min-height:16px;
  }
  .status.active{color:var(--accent);}

  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:24px;
  }
  @media (max-width:600px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .card.show{opacity:1;transform:translateY(0);}

  .card img{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
    background:#000;
  }
  .card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
  }
  .card-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
  }
  .dl-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--bg);
    background:var(--accent);
    border:none;
    border-radius:5px;
    padding:6px 10px;
    cursor:pointer;
    text-decoration:none;
    font-weight:700;
  }
  .dl-btn:hover{background:#dbff70;}

  .actions{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .btn-secondary{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 14px;
    cursor:pointer;
  }
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Visor · Extracción automática</div>
    <h1>Extractor de frames</h1>
    <p class="sub">Sube un video y se extraen 3 frames automáticamente (25%, 50%, 75% de la duración), listos como JPG.</p>
  </header>

  <div class="drop" id="dropZone">
    <div class="icon">▶</div>
    <div class="main-txt">Arrastra un video aquí o haz clic para elegir</div>
    <div class="sub-txt">MP4, WEBM, MOV — todo se procesa en tu navegador</div>
    <input type="file" id="fileInput" accept="video/*">
  </div>

  <div class="status" id="status"></div>

  <video id="video" muted playsinline></video>
  <canvas id="canvas"></canvas>

  <div class="grid" id="grid"></div>

  <div class="actions" id="actions" style="display:none;">
    <button class="btn-secondary" id="resetBtn">Cargar otro video</button>
  </div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const actions = document.getElementById('actions');
const resetBtn = document.getElementById('resetBtn');

const FRACTIONS = [0.25, 0.5, 0.75];
const LABELS = ['Frame 1 · 25%', 'Frame 2 · 50%', 'Frame 3 · 75%'];

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});
resetBtn.addEventListener('click', () => location.reload());

function setStatus(msg, active) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (active ? ' active' : '');
}

function handleFile(file) {
  grid.innerHTML = '';
  actions.style.display = 'none';
  const url = URL.createObjectURL(file);
  video.src = url;
  setStatus('Cargando metadata del video…', true);

  video.addEventListener('loadedmetadata', () => extractFrames(), { once: true });
  video.addEventListener('error', () => setStatus('No se pudo leer este archivo de video.', false));
}

async function extractFrames() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  const duration = video.duration;

  for (let i = 0; i < FRACTIONS.length; i++) {
    setStatus(`Extrayendo frame ${i + 1} de 3…`, true);
    const t = duration * FRACTIONS[i];
    await seekTo(t);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    addCard(dataUrl, i);
  }

  setStatus('Listo — 3 frames extraídos automáticamente.', false);
  actions.style.display = 'flex';
}

function seekTo(time) {
  return new Promise(resolve => {
    const onSeeked = () => {
      video.removeEventListener('seeked', onSeeked);
      resolve();
    };
    video.addEventListener('seeked', onSeeked);
    video.currentTime = time;
  });
}

function addCard(dataUrl, index) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <img src="${dataUrl}" alt="${LABELS[index]}">
    <div class="card-foot">
      <span class="card-label">${LABELS[index]}</span>
      <a class="dl-btn" href="${dataUrl}" download="frame-${index + 1}.jpg">JPG ↓</a>
    </div>
  `;
  grid.appendChild(card);
  requestAnimationFrame(() => card.classList.add('show'));
}
</script>
</body>
</html>
